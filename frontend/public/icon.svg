<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Infer134 icon">
  <title>Infer134</title>

  <!-- Rounded square background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#0f1a2e" />

  <!-- Subtle diagonal hatch suggesting offchain layer -->
  <g opacity="0.08" stroke="#f4f6fa" stroke-width="1">
    <line x1="0"   y1="40"  x2="256" y2="40"  />
    <line x1="0"   y1="80"  x2="256" y2="80"  />
    <line x1="0"   y1="120" x2="256" y2="120" />
    <line x1="0"   y1="160" x2="256" y2="160" />
    <line x1="0"   y1="200" x2="256" y2="200" />
  </g>

  <!-- Outer hex vault -->
  <polygon
    points="128,32 208,76 208,180 128,224 48,180 48,76"
    fill="none" stroke="#f4f6fa" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner hex (offchain compute layer, dashed) -->
  <polygon
    points="128,60 184,90 184,166 128,196 72,166 72,90"
    fill="none" stroke="#9aa6c2" stroke-width="2.5" stroke-dasharray="4 6" stroke-linejoin="round" />

  <!-- 134 -->
  <text
    x="128" y="148" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-weight="700" font-size="64" fill="#f4f6fa" letter-spacing="-3">134</text>

  <!-- Verified-payment chip -->
  <g>
    <circle cx="196" cy="196" r="28" fill="#22c55e" stroke="#0f1a2e" stroke-width="4" />
    <path d="M184 196 L193 205 L210 186" stroke="#0f1a2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
