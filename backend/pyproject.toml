[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infer134-backend"
version = "0.1.0"
description = "Local FastAPI coordinator for the Infer134 hackathon MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2,<3",
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]

[tool.setuptools.packages.find]
include = ["app*"]
