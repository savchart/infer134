[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infer134-worker-node"
version = "0.1.0"
description = "Local compute worker for the Infer134 hackathon MVP with mock and vLLM runtime modes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2,<3",
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
# Heavy GPU runtime; install only when running INFER134_RUNTIME=vllm.
# Pin a major range that supports Turing-class GPUs (sm_70+, e.g. RTX 2070).
vllm = [
  "vllm>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
